# BDO Keep — один compose, минимум сервисов
# db (Postgres) + migrate (авто-SQL) + web (Nuxt / Nitro API)
# Studio/Kong/Auth/Realtime/Storage/PostgREST НЕ нужны

name: bdokeep

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bdokeep}
      # Used by migrate → 022_bdokeep_app.sh (and available if someone execs into db).
      BDOKEEP_APP_PASSWORD: ${BDOKEEP_APP_PASSWORD:?Set BDOKEEP_APP_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    # Порты не публикуем: Nitro ходит на db:5432 по Docker-сети.

  migrate:
    image: postgres:16-alpine
    restart: 'no'
    # Share db network so we can use 127.0.0.1 trust (volume password may
    # differ from current .env POSTGRES_PASSWORD; TCP from other containers uses scram).
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      POSTGRES_USER: postgres
      # Unused for local trust; kept for psql scripts that export PGPASSWORD.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bdokeep}
      BDOKEEP_APP_PASSWORD: ${BDOKEEP_APP_PASSWORD:?Set BDOKEEP_APP_PASSWORD in .env}
      MIG_DIR: /migrations
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ['/bin/sh', '/migrate.sh']

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://bdokeep_app:${BDOKEEP_APP_PASSWORD}@db:5432/${POSTGRES_DB:-bdokeep}
      # Required — no default. Refuse weak values in production (see adminAuth).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
      # Set to 1 only behind a reverse proxy that controls X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - '${HOST_PORT:-3000}:3000'

volumes:
  db_data:
