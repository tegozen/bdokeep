# BDO Keep — один compose, минимум сервисов
# db (Postgres) + rest (PostgREST API) + adminer (редактор таблиц) + web (Nuxt)
# Studio/Kong/Auth/Realtime/Storage НЕ нужны для гильдейского гайда

name: bdokeep

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bdokeep}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/migrations/000_roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./supabase/migrations/001_init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./supabase/migrations/002_seed_skills.sql:/docker-entrypoint-initdb.d/20-skills.sql:ro
      - ./supabase/migrations/004_combo_steps.sql:/docker-entrypoint-initdb.d/40-combo-steps.sql:ro
      - ./supabase/migrations/005_proposals.sql:/docker-entrypoint-initdb.d/50-proposals.sql:ro
      - ./supabase/migrations/006_drop_pvp_role.sql:/docker-entrypoint-initdb.d/60-drop-pvp-role.sql:ro
      - ./supabase/migrations/007_buffs_proposals.sql:/docker-entrypoint-initdb.d/70-buffs-proposals.sql:ro
      - ./supabase/migrations/008_seed_buffs.sql:/docker-entrypoint-initdb.d/80-seed-buffs.sql:ro
      - ./supabase/migrations/009_drop_guide_skills.sql:/docker-entrypoint-initdb.d/90-drop-guide-skills.sql:ro
      - ./supabase/migrations/010_seed_crystals.sql:/docker-entrypoint-initdb.d/91-seed-crystals.sql:ro
      - ./supabase/migrations/011_crystals_proposals.sql:/docker-entrypoint-initdb.d/92-crystals-proposals.sql:ro
      - ./supabase/migrations/012_crystal_presets.sql:/docker-entrypoint-initdb.d/93-crystal-presets.sql:ro
      - ./supabase/migrations/013_crystal_preset_sub.sql:/docker-entrypoint-initdb.d/94-crystal-preset-sub.sql:ro
      - ./supabase/migrations/014_relic_presets.sql:/docker-entrypoint-initdb.d/95-relic-presets.sql:ro
      - ./supabase/migrations/015_seed_relics_lightstones.sql:/docker-entrypoint-initdb.d/96-seed-relics.sql:ro
      - ./supabase/migrations/016_buff_presets.sql:/docker-entrypoint-initdb.d/97-buff-presets.sql:ro
      - ./supabase/migrations/017_videos_proposals.sql:/docker-entrypoint-initdb.d/98-videos.sql:ro
      - ./supabase/migrations/018_morphs.sql:/docker-entrypoint-initdb.d/99-morphs.sql:ro
      - ./supabase/migrations/019_seed_skill_addon_effects.sql:/docker-entrypoint-initdb.d/99b-seed-addon-effects.sql:ro
      - ./supabase/migrations/020_morph_grants.sql:/docker-entrypoint-initdb.d/99c-morph-grants.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    # Postgres только во внутренней сети compose (Adminer ходит на db:5432)

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bdokeep}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: '*'
    ports:
      - '${API_PORT:-8000}:3000'

  # Редактор БД вместо тяжёлого Supabase Studio
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '${ADMINER_PORT:-3001}:8080'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:8000}
        NUXT_PUBLIC_SUPABASE_ANON_KEY: ${NUXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # browser on host
      NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:8000}
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${NUXT_PUBLIC_SUPABASE_ANON_KEY}
      # SSR inside this container → docker DNS (Nuxt maps NUXT_* → runtimeConfig)
      NUXT_SUPABASE_INTERNAL_URL: http://rest:3000
      SUPABASE_INTERNAL_URL: http://rest:3000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    ports:
      - '${HOST_PORT:-3000}:3000'

volumes:
  db_data:
