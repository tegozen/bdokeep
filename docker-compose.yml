# BDO Keep — один compose, минимум сервисов
# db (Postgres) + migrate (Drizzle + seed) + web (Nuxt / Nitro API)

name: bdokeep

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bdokeep}
      BDOKEEP_APP_PASSWORD: ${BDOKEEP_APP_PASSWORD:?Set BDOKEEP_APP_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    restart: 'no'
    # Share db network so we can use 127.0.0.1 trust (volume password may
    # differ from current .env POSTGRES_PASSWORD; TCP from other containers uses scram).
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdokeep}
      BDOKEEP_APP_PASSWORD: ${BDOKEEP_APP_PASSWORD:?Set BDOKEEP_APP_PASSWORD in .env}
      # Superuser over localhost trust (no password). Do not use bdokeep_app here.
      MIGRATE_DATABASE_URL: postgres://postgres@127.0.0.1:5432/${POSTGRES_DB:-bdokeep}
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/${POSTGRES_DB:-bdokeep}
      # Set FORCE_SEED=1 to re-apply all catalog fixtures (ignore hash ledger).
      FORCE_SEED: ${FORCE_SEED:-}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CPU_COUNT: ${BUILD_CPU_COUNT:-1}
        BUILD_NODE_MAX_OLD_SPACE: ${BUILD_NODE_MAX_OLD_SPACE:-768}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://bdokeep_app:${BDOKEEP_APP_PASSWORD}@db:5432/${POSTGRES_DB:-bdokeep}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
      NITRO_COMPRESS: ${NITRO_COMPRESS:-}
    ports:
      - '${HOST_PORT:-3000}:3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    cpus: ${WEB_CPUS:-1.0}

volumes:
  db_data:
