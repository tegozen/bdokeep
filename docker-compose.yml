# BDO Keep — один compose, минимум сервисов
# db (Postgres) + web (Nuxt / Nitro API)
# Studio/Kong/Auth/Realtime/Storage/PostgREST НЕ нужны

name: bdokeep

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bdokeep}
      # App role password (Nitro). Must differ from superuser in production setups.
      BDOKEEP_APP_PASSWORD: ${BDOKEEP_APP_PASSWORD:?Set BDOKEEP_APP_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations/000_roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/migrations/002_seed_skills.sql:/docker-entrypoint-initdb.d/20-skills.sql:ro
      - ./db/migrations/004_combo_steps.sql:/docker-entrypoint-initdb.d/40-combo-steps.sql:ro
      - ./db/migrations/005_proposals.sql:/docker-entrypoint-initdb.d/50-proposals.sql:ro
      - ./db/migrations/006_drop_pvp_role.sql:/docker-entrypoint-initdb.d/60-drop-pvp-role.sql:ro
      - ./db/migrations/007_buffs_proposals.sql:/docker-entrypoint-initdb.d/70-buffs-proposals.sql:ro
      - ./db/migrations/008_seed_buffs.sql:/docker-entrypoint-initdb.d/80-seed-buffs.sql:ro
      - ./db/migrations/009_drop_guide_skills.sql:/docker-entrypoint-initdb.d/90-drop-guide-skills.sql:ro
      - ./db/migrations/010_seed_crystals.sql:/docker-entrypoint-initdb.d/91-seed-crystals.sql:ro
      - ./db/migrations/011_crystals_proposals.sql:/docker-entrypoint-initdb.d/92-crystals-proposals.sql:ro
      - ./db/migrations/012_crystal_presets.sql:/docker-entrypoint-initdb.d/93-crystal-presets.sql:ro
      - ./db/migrations/013_crystal_preset_sub.sql:/docker-entrypoint-initdb.d/94-crystal-preset-sub.sql:ro
      - ./db/migrations/014_relic_presets.sql:/docker-entrypoint-initdb.d/95-relic-presets.sql:ro
      - ./db/migrations/015_seed_relics_lightstones.sql:/docker-entrypoint-initdb.d/96-seed-relics.sql:ro
      - ./db/migrations/016_buff_presets.sql:/docker-entrypoint-initdb.d/97-buff-presets.sql:ro
      - ./db/migrations/017_videos_proposals.sql:/docker-entrypoint-initdb.d/98-videos.sql:ro
      - ./db/migrations/018_morphs.sql:/docker-entrypoint-initdb.d/99-morphs.sql:ro
      - ./db/migrations/019_seed_skill_addon_effects.sql:/docker-entrypoint-initdb.d/99b-seed-addon-effects.sql:ro
      - ./db/migrations/020_morph_grants.sql:/docker-entrypoint-initdb.d/99c-morph-grants.sql:ro
      - ./db/migrations/021_morph_presets_guide.sql:/docker-entrypoint-initdb.d/99d-morph-presets.sql:ro
      - ./db/migrations/022_bdokeep_app.sh:/docker-entrypoint-initdb.d/99e-bdokeep-app.sh:ro
      - ./db/migrations/023_guide_morphs_rls.sql:/docker-entrypoint-initdb.d/99f-guide-morphs-rls.sql:ro
      - ./db/migrations/024_class_tier.sql:/docker-entrypoint-initdb.d/99g-class-tier.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    # Только localhost на хосте (npm run dev / psql); наружу в прод не публиковать
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://bdokeep_app:${BDOKEEP_APP_PASSWORD}@db:5432/${POSTGRES_DB:-bdokeep}
      # Required — no default. Refuse weak values in production (see adminAuth).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Set to 1 only behind a reverse proxy that controls X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - '${HOST_PORT:-3000}:3000'

volumes:
  db_data:
