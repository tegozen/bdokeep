server {
  listen 80;
  root /usr/share/nginx/html;
  location = /assets/remoteEntry.js {
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri =404;
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "public, max-age=60";
  }
}
