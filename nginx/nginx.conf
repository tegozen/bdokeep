# Internal edge — only this publishes HOST_PORT. External reverse proxy unchanged.
# BDO Keep microfrontends + microservices gateway

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Docker embedded DNS — re-resolve service names after recreate (avoid stale IPs).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 3000;
  server_name _;
  client_max_body_size 2m;

  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # --- MFE remotes (Module Federation assets) ---
  # set before rewrite: `rewrite … break` skips later rewrite-phase directives.
  location /mf/feedback/ {
    set $u mf-feedback:80;
    rewrite ^/mf/feedback/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/chat-macro/ {
    set $u mf-chat-macro:80;
    rewrite ^/mf/chat-macro/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/crystals/ {
    set $u mf-crystals:80;
    rewrite ^/mf/crystals/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/relics/ {
    set $u mf-relics:80;
    rewrite ^/mf/relics/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/hardening/ {
    set $u mf-hardening:80;
    rewrite ^/mf/hardening/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/morphs/ {
    set $u mf-morphs:80;
    rewrite ^/mf/morphs/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/combo/ {
    set $u mf-combo:80;
    rewrite ^/mf/combo/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/buffs/ {
    set $u mf-buffs:80;
    rewrite ^/mf/buffs/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/videos/ {
    set $u mf-videos:80;
    rewrite ^/mf/videos/(.*)$ /$1 break;
    proxy_pass http://$u;
  }
  location /mf/summary/ {
    set $u mf-summary:80;
    rewrite ^/mf/summary/(.*)$ /$1 break;
    proxy_pass http://$u;
  }

  # --- Extracted microservices ---
  location /api/youtube/ {
    set $u svc-youtube:3011;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/feedback {
    set $u svc-feedback:3012;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/admin/feedback {
    set $u svc-feedback:3012;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/sections/crystals/ {
    set $u svc-crystals:3020;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
  }
  location /api/sections/relics/ {
    set $u svc-relics:3021;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
  }
  location /api/sections/hardening/ {
    set $u svc-hardening:3022;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
  }
  location /api/sections/morphs/ {
    set $u svc-morphs:3023;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
  }
  location /api/sections/combo/ {
    set $u svc-combo:3024;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
  }
  location /api/sections/buffs/ {
    set $u svc-buffs:3025;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
  }
  location /api/sections/videos/ {
    set $u svc-videos:3026;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
  }
  location /api/sections/summary/ {
    set $u svc-summary:3027;
    proxy_pass http://$u;
    proxy_set_header Host $http_host;
  }

  # Host shell: pages (home, class, admin) + remaining API
  location / {
    set $u web:3000;
    proxy_pass http://$u;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
